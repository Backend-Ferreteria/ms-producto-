spring.application.name=ms-producto
spring.datasource.url=jdbc:postgresql://localhost:5432/db-producto
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8862

app.gateway-base-url=${GATEWAY_BASE_URL:http://localhost:8081/api}
app.upload-dir=${UPLOAD_DIR:uploads/products}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-vx0d4nhti2zb58wx.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://api.ferreteria.com}